<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Control remoto de Glass Home 1.6.0</title>
<desc id="desc">Desde Netflix, arriba lleva a la recomendación; desde las otras apps, a Continuar viendo. Arriba desde las tarjetas va a categorías y desde categorías al fútbol. Abajo desde el dock abre todas las apps.</desc>
