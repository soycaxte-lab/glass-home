<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Dos pasos y dos puertos distintos</title>
  <desc id="desc">Primero empareja con el puerto de emparejamiento y su código temporal. Después conecta con el puerto de la pantalla principal de depuración inalámbrica. Es un esquema, no una captura de Ajustes.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b40"/><stop offset="1" stop-color="#12344c"/></linearGradient></defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif" fill="#f1f5ff">
    <text x="48" y="62" font-size="30" font-weight="700">Conexión inalámbrica: no confundas los puertos</text>
    <text x="48" y="98" font-size="20" fill="#bfcbe1">Usa siempre los datos actuales que muestra tu propia TV.</text>
    <rect x="48" y="132" width="528" height="280" rx="22" fill="#ffffff" fill-opacity=".07" stroke="#8c9bba"/>
    <rect x="600" y="132" width="552" height="280" rx="22" fill="#ffffff" fill-opacity=".07" stroke="#8c9bba"/>
    <circle cx="90" cy="177" r="23" fill="#bbcaff"/><text x="83" y="185" fill="#17233d" font-size="24" font-weight="700">1</text>
    <text x="128" y="185" font-size="25" font-weight="700">Emparejar el ordenador</text>
    <text x="78" y="235" font-size="20">En la TV: «Emparejar con código»</text>
    <text x="78" y="274" font-size="20" fill="#cbd7ed">Dirección + puerto de emparejamiento</text>
    <text x="78" y="310" font-size="20" fill="#cbd7ed">Código temporal: introdúcelo en tu terminal</text>
    <text x="78" y="372" font-size="22" font-family="monospace" fill="#b9eed9">adb pair IP:PUERTO_EMPAREJAMIENTO</text>
    <circle cx="642" cy="177" r="23" fill="#bbcaff"/><text x="635" y="185" fill="#17233d" font-size="24" font-weight="700">2</text>
    <text x="680" y="185" font-size="25" font-weight="700">Conectar para instalar</text>
    <text x="630" y="235" font-size="20">Vuelve a la pantalla principal de</text>
    <text x="630" y="268" font-size="20">«Depuración inalámbrica»</text>
    <text x="630" y="310" font-size="20" fill="#cbd7ed">Copia su dirección + puerto de conexión</text>
    <text x="630" y="372" font-size="22" font-family="monospace" fill="#b9eed9">adb connect IP:PUERTO_CONEXION</text>
    <text x="48" y="461" font-size="20">Los comandos completos para Windows están en el tutorial.</text>
    <text x="48" y="493" font-size="18" fill="#bfcbe1">Esquema ilustrativo · Los menús varían por modelo · No publiques códigos ni contraseñas</text>
  </g>
</svg>
